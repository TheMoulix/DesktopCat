name: Build & Release DesktopCat

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --onefile `
            --name "DesktopCat" `
            --icon "app_icon.ico" `
            --add-data "gif;gif" `
            --add-data "app_icon.ico;." `
            --hidden-import "cat_overlay_windows" `
            --exclude-module "cat_overlay_linux" `
            cat_overlay.pyw

      - name: Package Windows Release
        run: |
          New-Item -ItemType Directory -Path "release_win" | Out-Null
          Copy-Item "dist\DesktopCat.exe" "release_win\"
          Copy-Item "gif" "release_win\gif" -Recurse
          Copy-Item "README.md" "release_win\"
          Compress-Archive -Path "release_win\*" -DestinationPath "DesktopCat-windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCat-windows-x64
          path: DesktopCat-windows-x64.zip

  package-linux:
    name: Package Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Linux portable bundle
        run: |
          mkdir -p DesktopCat
          cp -r gif DesktopCat/
          cp cat_overlay.py cat_overlay_linux.py DesktopCat/
          cp setup.sh start.sh stop.sh DesktopCat/
          cp DesktopCat.desktop app_icon.png requirements.txt README.md DesktopCat/
          chmod +x DesktopCat/*.sh DesktopCat/*.py DesktopCat/*.desktop
          tar -czf DesktopCat-linux.tar.gz DesktopCat/
          zip -r DesktopCat-linux.zip DesktopCat/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCat-linux
          path: |
            DesktopCat-linux.tar.gz
            DesktopCat-linux.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, package-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DesktopCat-windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: DesktopCat-linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DesktopCat-windows-x64.zip
            DesktopCat-linux.tar.gz
            DesktopCat-linux.zip
          draft: false
          prerelease: false
          generate_release_notes: true
